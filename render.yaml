services:
  - type: web
    name: hayat-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx nest build
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/hospitals
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: api
      - key: APP_ORIGIN
        value: "*"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_LENGTH
        value: 6
      - key: OTP_TTL_SECONDS
        value: 300
      - key: OTP_MAX_ATTEMPTS
        value: 5
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: 60
      - key: SMS_PROVIDER
        value: console
      - key: SMS_SENDER_ID
        value: HAYAT
      - key: AI_MODEL
        value: claude-sonnet-4-6
      - key: AI_MAX_TOKENS
        value: 1024
      - key: AI_TEMPERATURE
        value: "0.2"
      - key: GROQ_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: THROTTLE_DEFAULT
        value: 60
      - key: THROTTLE_AUTH
        value: 10
      - key: THROTTLE_EMERGENCY
        value: 20
      - key: LOG_LEVEL
        value: info
      # Secrets — fill in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
